<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kod Hattı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --ink:#152030; --muted:#566377; --faint:#8793a5;
  --rule:#d5dce6; --accent:#0b4f9c; --accent-ink:#ffffff; --accent-soft:#e3edf9;
  --ok:#17804a; --ok-soft:#e2f4ea; --bad:#c2303b; --bad-soft:#fbe7e9; --warn:#9a6a12; --warn-soft:#fbf1dc;
  --code-bg:#f3f5f9; --code-ink:#1d2736; --tok-kw:#8a2bb3; --tok-str:#1f7a3f; --tok-num:#b3541e; --tok-com:#7f8a9a; --tok-fn:#0b5cad;
  --shadow:0 1px 2px rgba(21,32,48,.06),0 4px 16px rgba(21,32,48,.06);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0e131a; --panel:#151c26; --panel-2:#1a2330; --ink:#e4e9f0; --muted:#a2adbd; --faint:#6f7b8d;
    --rule:#2a3544; --accent:#6aa6ff; --accent-ink:#0b1220; --accent-soft:#1b2a40;
    --ok:#4cc38a; --ok-soft:#153024; --bad:#ff6b76; --bad-soft:#3a1b20; --warn:#e3b049; --warn-soft:#352a14;
    --code-bg:#10161f; --code-ink:#dfe6ef; --tok-kw:#d19bff; --tok-str:#7fd49a; --tok-num:#ffab70; --tok-com:#6f7b8d; --tok-fn:#79b8ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0e131a; --panel:#151c26; --panel-2:#1a2330; --ink:#e4e9f0; --muted:#a2adbd; --faint:#6f7b8d;
  --rule:#2a3544; --accent:#6aa6ff; --accent-ink:#0b1220; --accent-soft:#1b2a40;
  --ok:#4cc38a; --ok-soft:#153024; --bad:#ff6b76; --bad-soft:#3a1b20; --warn:#e3b049; --warn-soft:#352a14;
  --code-bg:#10161f; --code-ink:#dfe6ef; --tok-kw:#d19bff; --tok-str:#7fd49a; --tok-num:#ffab70; --tok-com:#6f7b8d; --tok-fn:#79b8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,textarea,.opt,.ord-line,.fill-code{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.opt.duz{font-feature-settings:normal}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* ─── yerleşim ─── */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--rule);padding:20px 18px 28px;scrollbar-width:thin}
.main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.wrap>*,.q>*,.warmup>*{min-width:0}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px/1 var(--display);font-stretch:85%}
.brand b{font:800 21px/1 var(--display);font-stretch:88%;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.pybar{margin:16px 0 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:7px 10px}
.pybar .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.pybar[data-s="yukleniyor"] .dot{background:var(--warn);animation:nabiz 1s infinite}
.pybar[data-s="hazir"] .dot{background:var(--ok)}
.pybar[data-s="hata"] .dot{background:var(--bad)}
.pybar button{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
@keyframes nabiz{50%{opacity:.35}}

/* hat şeması */
.line-map{list-style:none;margin:6px 0 0;padding:0;position:relative}
.line-map::before{content:"";position:absolute;left:17px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--rule)}
.line-map .fill{position:absolute;left:17px;top:14px;width:6px;border-radius:3px;background:var(--accent);transition:height .4s}
.stop{position:relative}
.stop a{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 4px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.25}
.stop a:hover{background:var(--panel-2)}
.stop a[aria-current="page"]{background:var(--accent-soft)}
.stop .node{position:relative;z-index:1;flex:0 0 32px;height:32px;display:grid;place-items:center}
.stop .node span{width:30px;height:22px;border-radius:5px;display:grid;place-items:center;font:800 11px/1 var(--display);font-stretch:85%;color:#fff;box-shadow:0 0 0 3px var(--panel)}
.stop.tekrar .node span{width:22px;height:22px;border-radius:50%;background:var(--panel)!important;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--panel)}
.stop .nm{flex:1;min-width:0}
.stop .nm small{display:block;color:var(--faint);font-size:11.5px}
.stop .chk{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.stop.bitti .chk{color:var(--ok);font-weight:600}
.side-links{display:flex;flex-direction:column;gap:2px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.side-links a{padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:13.5px}
.side-links a:hover{background:var(--panel-2)}
.side-links a[aria-current="page"]{background:var(--accent-soft)}
.theme-row{display:flex;gap:6px;margin-top:14px}
.theme-row button{flex:1;border:1px solid var(--rule);background:var(--panel-2);border-radius:7px;padding:5px;font-size:12px;cursor:pointer}
.theme-row button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.mobile-top{display:none}

/* ─── içerik ─── */
.ch-head{display:flex;gap:18px;align-items:flex-start}
.ch-badge{flex:0 0 auto;width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--display);font-stretch:80%}
.ch-badge.tekrar{border-radius:50%;background:var(--panel)!important;border:9px solid var(--ink);color:var(--ink);font-size:0}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ch-head h1{font-size:clamp(26px,4vw,36px);font-weight:800;font-stretch:88%;margin-top:6px;letter-spacing:-.015em}
.ch-head p{margin:6px 0 0;color:var(--muted)}
.prose{max-width:68ch}
.prose h3{font-size:18px;font-weight:700;margin:22px 0 6px}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose code,.q-text code,.why code,.hint code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
pre.py,pre.out,.q-code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;margin:8px 0 12px;overflow-x:auto;font-size:13px;line-height:1.55;white-space:pre}
.t-kw{color:var(--tok-kw);font-weight:600}.t-str{color:var(--tok-str)}.t-num{color:var(--tok-num)}.t-com{color:var(--tok-com);font-style:italic}.t-fn{color:var(--tok-fn)}

.proje{border:1px solid var(--rule);border-radius:12px;background:var(--panel);overflow:hidden}
.proje header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--panel-2);font-size:12.5px;color:var(--muted)}
.proje header b{color:var(--ink);font-weight:600}
.proje pre{margin:0;border:0;border-radius:0}

.warmup{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px 16px}
.warmup .eyebrow{color:var(--warn)}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-top:10px}
.sec-title h2{font-size:20px;font-weight:800;font-stretch:90%}
.sec-title span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* soru kartı */
.q{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.q[data-durum="dogru"]{border-color:color-mix(in srgb,var(--ok) 55%,var(--rule))}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.q-top .tur{font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.q-top .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--rule);color:var(--muted)}
.q-text{font-size:15px}
.q-code{margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--panel-2);border-radius:9px;padding:9px 12px;cursor:pointer;font-family:var(--mono);font-size:13.5px}
.opt.duz{font-family:var(--body);font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.dogru{border-color:var(--ok);background:var(--ok-soft)}
.opt.yanlis{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:9px;padding:9px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.info{background:var(--panel-2);border-left:4px solid var(--faint)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.ana{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ana:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11.5px;color:var(--faint)}
/* boşluk doldur */
.fill-code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;font:13px/2 var(--mono);white-space:pre;overflow-x:auto}
.fill-code input{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--faint);border-radius:5px;padding:1px 5px;min-width:3ch}
.fill-code input.dogru{border-color:var(--ok);background:var(--ok-soft)}
.fill-code input.yanlis{border-color:var(--bad);background:var(--bad-soft)}
/* sıralama */
.ord{display:grid;gap:10px}
.ord-box{border:1px dashed var(--rule);border-radius:9px;padding:8px;min-height:46px;display:flex;flex-direction:column;gap:6px}
.ord-box.cevap{border-style:solid;background:var(--panel-2)}
.ord-box .lbl{font-size:11.5px;color:var(--faint);padding:0 4px}
.ord-line{font:13px/1.4 var(--mono);white-space:pre;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;overflow-x:auto}
.ord-line:hover{border-color:var(--accent)}
/* editör */
.ed{position:relative;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--code-bg)}
.ed textarea{display:block;width:100%;min-height:150px;resize:vertical;border:0;background:transparent;color:var(--code-ink);padding:12px 14px;font-size:13px;line-height:1.55;tab-size:4;white-space:pre;overflow:auto}
.ed textarea:focus{outline:none}
.ed:focus-within{border-color:var(--accent)}
.out{background:var(--code-bg);border:1px solid var(--rule);border-radius:9px;padding:10px 14px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-x:auto;max-height:340px;overflow-y:auto}
.out .err{color:var(--bad)}
.out img{display:block;max-width:100%;background:#fff;border-radius:6px;margin-top:8px}
.hint{font-size:14px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:9px;padding:9px 12px}

/* genel bakış */
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;font-stretch:82%;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:800 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:38px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;text-decoration:none;color:var(--ink)}
.mini{display:grid;place-items:center;width:34px;height:22px;border-radius:5px;color:#fff;font:800 11px/1 var(--display);font-stretch:85%}
.barrow .t{display:block;font-size:13px;margin-bottom:4px}
.barrow .b{display:block;height:10px;border-radius:5px;background:var(--panel-2);border:1px solid var(--rule);overflow:hidden}
.barrow .b i{display:block;height:100%}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px}
.weak a b{color:var(--bad);font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.pager a{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a.sonraki{text-align:right}
.score{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.acik{transform:none}
  .mobile-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 16px}
  .mobile-top button{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:5px 11px;cursor:pointer}
  .mobile-top b{font:800 17px/1 var(--display);font-stretch:88%}
  .main{padding-block:18px 60px}
  .stats{grid-template-columns:1fr}
  .ch-head{gap:12px}.ch-badge{width:48px;height:48px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="mobile-top"><button id="menuBtn" aria-controls="side" aria-expanded="false">Duraklar</button><b>Kod Hattı</b></div>
<div class="app">
  <nav class="side" id="side" aria-label="Bölümler">
    <a class="brand" href="#harita"><span class="logo">Py</span><span><b>Kod Hattı</b><small>İstanbul raylı sistem projesiyle Python</small></span></a>
    <div class="pybar" id="pybar" data-s="yok"><span class="dot"></span><span id="pytxt">Python yüklenmedi</span><button id="pyload">Yükle</button></div>
    <ol class="line-map" id="lineMap"><div class="fill" id="lineFill"></div></ol>
    <div class="side-links">
      <a href="#harita" data-r="harita">Hat haritası · ilerleme</a>
      <a href="#deneme" data-r="deneme">Deneme tahtası</a>
    </div>
    <div class="theme-row" role="group" aria-label="Tema">
      <button data-t="system">Sistem</button><button data-t="light">Açık</button><button data-t="dark">Koyu</button>
    </div>
  </nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script id="icerik" type="application/json">{"bolumler": [{"id": "b1", "no": 1, "tur": "ders", "baslik": "Python'a ilk adım", "hat": "M1", "ozet": "Değişkenler, sayılar, metinler ve ekrana yazdırma.", "anlatim": "\n<p>Python'da bir değere isim vermek için <b>değişken<\/b> kullanırsın. Eşittir işareti \"sağdakini soldaki isme koy\" demektir:<\/p>\n<pre class=\"py\">yolcu = 23301956          # tam sayı (int)\npay = 12.5                  # ondalıklı sayı (float)\nhat = \"M2\"                  # metin (str) — tırnak içinde\nhafta_sonu = False          # doğru/yanlış (bool)<\/pre>\n<p><code>#<\/code> işaretinden sonrası <b>yorum<\/b>dur; Python onu okumaz, sana not olarak kalır.<\/p>\n<h3>Sayılarla işlem<\/h3>\n<pre class=\"py\">print(7 + 3)     # 10\nprint(7 / 2)     # 3.5   → bölme her zaman float verir\nprint(7 // 2)    # 3     → tam kısmı\nprint(7 % 2)     # 1     → kalan\nprint(2 ** 3)    # 8     → üs<\/pre>\n<p>Büyük sayıları okumak için alt çizgi kullanabilirsin: <code>1_000_000<\/code> ile <code>1000000<\/code> aynı sayıdır. Senin projende yolcu sayılarını milyona çevirirken böyle yazmışsın.<\/p>\n<h3>f-string: metnin içine değer yerleştirmek<\/h3>\n<p>Tırnaktan önce <code>f<\/code> koyarsan, süslü parantez içindeki ifade hesaplanıp metne yazılır. İki nokta sonrası <b>biçim<\/b>dir: <code>.1f<\/code> \"virgülden sonra 1 basamak\" demek.<\/p>\n<pre class=\"py\">deger = 23.30196\nprint(f\"{deger:.1f} milyon\")   # 23.3 milyon\nprint(f\"%{deger:.0f}\")         # %23<\/pre>\n", "proje": "veri = (hat_yolcu / 1_000_000).sort_values()\n...\nax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "<code>print(7 // 2)<\/code> ne yazdırır?", "opts": ["3.5", "3", "4", "1"], "a": 1, "why": "<code>//<\/code> tam bölmedir; sonucun tam kısmını verir.", "tags": ["aritmetik"], "code": null, "rev": false}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["12.35", "12.3", "12.4", "12"], "a": 2, "why": "<code>.1f<\/c "Başta <code>f<\/code> olmalı; <code>.0f<\/code> ondalık bırakmaz ve 72.6'yı 73'e yuvarlar.", "tags": ["fstring"], "code": null, "rev": true}]}, {"id": "b2", "no": 2, "tur": "ders", "baslik": "Listeler ve sözlükler", "hat": "M2", "ozet": "Birden çok değeri bir arada tutmak: liste, dilimleme, sözlük.", "anlatim": "\n<p><b>Liste<\/b> sıralı bir kutudur. Köşeli parantezle yazılır, sayma <b>0'dan<\/b> başlar:<\/p>\n<pre class=\"py\">aylar = [\"Oca\", \"Şub\", \"Mar\", \"Nis\"]\naylar[0]      # \"Oca\"\naylar[-1]     # \"Nis\"  → sondan birinci\nlen(aylar)    # 4<\/pre>\n<h3>Dilimleme<\/h3>\n<p><code>liste[baslangic:bitis:adim]<\/code> — bitiş dahil değildir.<\/p>\n<pre class=\"py\">aylar[1:3]    # [\"Şub\", \"Mar\"]\naylar[:2]     # [\"Oca\", \"Şub\"]\naylar[::-1]   # [\"Nis\", \"Mar\", \"Şub\", \"Oca\"]  → ters çevirir<\/pre>\n<p>Projende <code>ilk10.iloc[::-1]<\/code> ile grafikte en büyük çubuğu en üste almak için sırayı ters çevirmişsin.<\/p>\n<h3>Sözlük (dict)<\/h3>\n<p>Sözlük <b>anahtar → değer<\/b> eşleşmesi tutar. Süslü parantezle yazılır:<\/p>\n<pre class=\"py\">TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\nTUR_RENK[\"Metro\"]              # \"#3b6ea5\"\nTUR_RENK[\"Teleferik\"]          # KeyError! yok\nTUR_RENK.get(\"Teleferik\", \"?\") # \"?\"  → yoksa varsayılanı döndür\nTUR_RENK[\"Teleferik\"] = \"#8c6bb1\"   # yeni anahtar ekle<\/pre>\n<p>Anomali bölümünde <code>aciklamalar.get(tarih, (\"?\", \"?\"))<\/code> yazmışsın: açıklaması olmayan günde hata yerine <code>\"?\"<\/code> döner.<\/p>\n", "proje": "TUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n...\ntablo[\"aciklama\"] = [aciklamalar.get(t.strftime(\"%Y-%m-%d\"), (\"?\", \"?\"))[0] for t in tablo.index]", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "Çıktı ne olur?", "opts": ["\"Oca\"", "\"Şub\"", "\"Ara\"", "hata"], "a": 2, "why": "<code>-1<\/code> sondan birinci elemandır.", "tags": ["liste"], "code": "aylar = [\"Oca\", \"Şub\", \"Mar\", \"Ara\"]\nprint(aylar[-1])", "rev": false}, {"t": "mc", "q": "<code>[10, 20, 30, 40, 50][1:3]<\/code> neyi verir?", "opts": ["[10, 20, 30]", "[20, 30]", "[20, 30, 40]", "[10, 20]"], "a": 1, "why": "Başlangıç (1) dahil, bitiş (3) hariç: indeks 1 ve 2.", "tags": ["dilim"], "code": null, "rev": false}, {"t": "fill", "q": "Sözlükte olmayan hat için hata yerine <code>\"gri\"<\/code> dönsün.", "code": "renk = {\"M1\": \"kırmızı\", \"M2\": \"yeşil\"}\nprint(renk.___(\"M9\", ___))", "a": [["get"], ["\"gri\"", "'gri'"]], "why": "<code>.get(anahtar, varsayılan)<\/code>", "tags": ["sozluk"], "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>TUR_RENK<\/code> sözlüğüne <code>\"Teleferik\"<\/code> anahtarıyla <code>\"#8c6bb1\"<\/code> değerini ekle, sonra sözlükteki anahtar sayısını <code>adet<\/code> değişkenine ata.", "starter": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\n\n", "sol": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\nTUR_RENK[\"Teleferik\"] = \"#8c6bb1\"\nadet = len(TUR_RENK)", "test": "assert TUR_RENK.get(\"Teleferik\") == \"#8c6bb1\", \"Teleferik anahtarı yok ya da değeri yanlış\"\nassert adet == 3, \"adet 3 olmalı\"", "hint": "Ekleme: <code>sozluk[anahtar] = deger<\/code>. Sayma: <code>len(...)<\/code>.", "tags": ["sozluk"], "setup": [], "rev": false, "why": ""}, {"t": "mc", "q": "<code>aylar[::-1]<\/code> ne yapar?", "opts": ["İlk elemanı siler", "Listeyi ters çevirir", "Son elemanı verir", "Hata verir"], "a": 1, "why": "Adım -1 olunca liste sondan başa okunur.", "tags": ["dilim"], "code": null, "rev": false}, {"t": "mc", "q": "<code>d = {\"a\": 1}<\/code> iken <code>d[\"b\"]<\/code> ne olur?", "opts": ["None", "0", "KeyError hatası", "\"b\""], "a": 2, "why": "Köşeli parantezle olmayan anahtar istenirse <code>KeyError<\/code>. Güvenli yol: <code>d.get(\"b\")<\/code>.", "tags": ["sozluk"], "code": null, "rev": true}, {"t": "mc", "q": "<code>len([\"M1\", \"M2\", \"M4\"])<\/code> kaçtır?", "opts": ["2", "3", "4", "M4"], "a": 1, "why": "Listede 3 eleman var.", "tags": ["liste"], "code": null, "rev": true}, {"t": "mc", "q": "<code>\"Yenikapı\"[:4]<\/code> neyi verir?", "opts": ["\"Yeni\"", "\"Yenik\"", "\"kapı\"", "\"ı\""], "a": 0, "why": "Metinler de liste gibi dilimlenir; indeks 0-3.", "tags": ["dilim"], "code": null, "rev": true}]}, {"id": "b3", "no": 3, "tur": "ders", "baslik": "Koşullar ve fonksiyonlar", "hat": "M3", "ozet": "if/elif ile karar vermek, def ile tekrar kullanılabilir kod yazmak.", "anlatim": "\n<h3>if / elif / else<\/h3>\n<pre class=\"py\">if yolcu > 1_000_000:\n    print(\"büyük hat\")\nelif yolcu > 100_000:\n    print(\"orta hat\")\nelse:\n    print(\"küçük hat\")<\/pre>\n<p>Girinti (4 boşluk) zorunludur: hangi satırın koşula ait olduğunu girinti belirler.\nKarşılaştırmalar: <code>==<\/code> eşit, <code>!=<\/code> eşit değil, <code>&gt; &lt; &gt;= &lt;=<\/code>. Birleştirme: <code>and<\/code>, <code>or<\/code>, <code>not<\/code>.<\/p>\n<h3>Fonksiyon<\/h3>\n<p><code>def<\/code> bir işi paketler; <code>return<\/code> sonucu geri verir ve fonksiyondan <b>hemen çıkar<\/b>.<\/p>\n<pre class=\"py\">def hat_turu(kod):\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    return \"Diğer\"\n\nhat_turu(\"TF1\")   # \"Teleferik\"\nhat_turu(\"M4\")    # \"Metro\"<\/pre>\n<p><b>Sıra önemli:<\/b> <code>\"TF1\"<\/code> hem \"TF\" hem \"T\" ile başlar. Senin <code>hat_turu<\/code> fonksiyonunda TF kontrolü T'den önce geldiği için teleferikler tramvay sayılmıyor.<\/p>\n<h3>Varsayılan parametre<\/h3>\n<pre class=\"py\">def baslik_ekle(ax, baslik, altbaslik=None):\n    if altbaslik:            # None ya da \"\" ise çalışmaz\n        ...<\/pre>\n<p><code>altbaslik<\/code> verilmezse <code>None<\/code> olur; fonksiyonu iki şekilde de çağırabilirsin.<\/p>\n", "proje": "def hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "Senin <code>hat_turu<\/code> fonksiyonun <code>hat_turu(\"F4\")<\/code> için ne döndürür?", "opts": ["\"Metro\"", "\"Tramvay\"", "\"Füniküler\"", "None"], "a": 2, "why": "Hiçbir if tutmaz, en alttaki <code>return \"Füniküler\"<\/code> çalışır.", "tags": ["fonksiyon", "kosul"], "code": null, "rev": false}, {"t": "mc", "q": "<code>TF<\/code> kontrolü <code>T<\/code> kontrolünün <b>altına<\/b> taşınsaydı <code>hat_turu(\"TF2\")<\/code> ne döndürürdü?", "opts": ["\"Teleferik\"", "\"Tramvay\"", "\"Metro\"", "hata"], "a": 1, "why": "İlk tutan koşulda <code>return<\/code> çalışır. \"TF2\" \"T\" ile başladığı için Tramvay dönerdi.", "tags": ["kosul"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>buyukluk(yolcu)<\/code> fonksiyonu yaz: 10 milyondan fazlaysa <code>\"büyük\"<\/code>, 1 milyondan fazlaysa <code>\"orta\"<\/code>, değilse <code>\"küçük\"<\/code> döndürsün.", "starter": "def buyukluk(yolcu):\n    # buraya yaz\n    pass\n", "sol": "def buyukluk(yolcu):\n    if yolcu > 10_000_000:\n        return \"büyük\"\n    elif yolcu > 1_000_000:\n        return \"orta\"\n    return \"küçük\"", "test": "assert buyukluk(23_000_000) == \"büyük\", \"23 milyon → büyük olmalı\"\nassert buyukluk(5_000_000) == \"orta\", \"5 milyon → orta olmalı\"\nassert buyukluk(200_000) == \"küçük\", \"200 bin → küçük olmalı\"\nassert buyukluk(10_000_000) == \"orta\", \"Tam 10 milyon 'fazla' değil → orta olmalı\"", "hint": "Büyükten küçüğe kontrol et: önce 10 milyon, sonra 1 milyon. <code>&gt;<\/code> kullan.", "tags": ["fonksiyon", "ko iki listeyi yan yana gezmek<\/h3>\n<pre class=\"py\">for ay, deger in zip([\"Oca\", \"Şub\"], [2.9, 3.0]):\n    print(ay, deger)<\/pre>\n<h3>List comprehension: tek satırda liste üretmek<\/h3>\n<pre class=\"py\">renkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]\n# şunun kısası:\nrenkler = []\nfor kod in veri.index:\n    renkler.append(TUR_RENK[hat_turu(kod)])<\/pre>\n<p>Süslü parantezle yazarsan <b>küme (set)<\/b> olur; tekrarlar atılır: <code>{hat_turu(k) for k in kodlar}<\/code>.<\/p>\n<h3>sorted ve key<\/h3>\n<pre class=\"py\">sorted([3, 1, 2])                          # [1, 2, 3]\nsorted(turler, key=list(TUR_RENK).index)   # TUR_RENK'teki sıraya göre<\/pre>\n<p><code>key<\/code> her eleman için bir \"sıralama puanı\" üreten fonksiyondur. Projende lejanttaki türleri hep aynı sırada (Metro, Tramvay, …) göstermek için böyle yapmışsın.<\/p>\n", "proje": "renkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]\nturler = sorted({hat_turu(kod) for kod in veri.index}, key=list(TUR_RENK).index)\n\nfor i, deger in enumerate(veri):\n    ax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "Çıktı ne olur?", "opts": ["0 M1 1 M2", "1 M1 2 M2", "M1 0 M2 1", "0 1"], "a": 0, "why": "<code>enumerate<\/code> 0'dan sayar ve (sıra, değer) çiftleri verir.", "tags": ["dongu"], "code": "for i, h in enumerate([\"M1\", \"M2\"]):\n    print(i, h, end=\" \")", "rev": false}, {"t": "mc", "q": "<code>{x % 3 for x in [1, 4, 7, 2]}<\/code> neyi verir?", "opts": ["[1, 1, 1, 2]", "{1, 2}", "{1, 1, 1, 2}", "[1, 2]"], "a": 1, "why": "Süslü parantez → küme; tekrar eden 1'ler tek kalır.", "tags": ["comprehension"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>yolcular<\/code> listesindeki sayıları milyona çevirip bir basamağa yuvarlayan bir list comprehension yaz; sonucu <code>milyon<\/code>'a ata.", "starter": "yolcular = [23_301_956, 12_527_183, 950_000]\nmilyon = \n", "sol": "yolcular = [23_301 or a, b in zip([1, 2, 3], [\"x\", \"y\"])<\/code> kaç tur döner?", "opts": ["3", "2", "5", "hata"], "a": 1, "why": "<code>zip<\/code> kısa olan liste bitince durur.", "tags": ["dongu"], "code": null, "rev": true}]}, {"id": "t1", "no": 1, "tur": "tekrar", "baslik": "Tekrar durağı 1", "aralik": [1, 2, 3, 4], "adet": 6, "ozet": "Python temellerini ne kadar hatırlıyorsun? İlk dört bölümden karışık sorular."}, {"id": "b5", "no": 5, "tur": "ders", "baslik": "Metin işleme ve regex", "hat": "M5", "ozet": "Türkçe İ/ı tuzağı ve istasyon adlarını re.sub ile temizlemek.", "anlatim": "\n<h3>Metin yöntemleri<\/h3>\n<pre class=\"py\">\"Kadıköy Doğu\".lower()          # \"kadıköy doğu\"\n\"a-b-c\".split(\"-\")              # [\"a\", \"b\", \"c\"]\n\" \".join([\"Hacı\", \"Osman\"])     # \"Hacı Osman\"\n\"M2 Taksim\".replace(\"M2 \", \"\")  # \"Taksim\"<\/pre>\n<h3>Türkçe İ/ı tuzağı<\/h3>\n<p>Python'un <code>.lower()<\/code> fonksiyonu İngilizce kuralını kullanır: <code>\"I\".lower()<\/code> → <code>\"i\"<\/code> (Türkçede <code>\"ı\"<\/code> olmalı),\n<code>\"İ\".lower()<\/code> → <code>\"i̇\"<\/code> (üstünde fazladan nokta olan iki karakter!). Bu yüzden önce harfleri elle değiştirmişsin:<\/p>\n<pre class=\"py\">def tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()<\/pre>\n<h3>Düzenli ifadeler (regex) ve re.sub<\/h3>\n<p><code>re.sub(desen, yeni, metin)<\/code> desene uyan her parçayı değiştirir. Sık kullanılan parçalar:<\/p>\n<ul>\n<li><code>\\d<\/code> rakam, <code>\\s<\/code> boşluk, <code>.<\/code> herhangi bir karakter<\/li>\n<li><code>+<\/code> bir veya daha fazla, <code>*<\/code> sıfır veya daha fazla, <code>?<\/code> (<code>.*?<\/code> içinde) \"olabildiğince az\"<\/li>\n<li><code>\\(<\/code> gerçek parantez karakteri, <code>( )<\/code> grup, <code>|<\/code> \"veya\", <code>\\b<\/code> kelime sınırı, <code>$<\/code> metnin sonu<\/li>\n<\/ul>\n<pre class=\"py\">import re\nre.sub(r\"\\(.*?\\)\", \" \", \"kadıköy (doğu)\")   # \"kadıköy  \"\nre.sub(r\"\\s+\", \" \", \"a    b\")               # \"a b\"<\/pre>\n<p>Desenlerin önüne <code>r<\/code> koymak (<em>raw string<\/em>) ters bölü işaretlerini olduğu gibi bırakır; regex yazarken hep kullan.<\/p>\n", "proje": "def istasyon_adi(ad):\n    ad = tr_kucuk(ad)\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)\n    ad = re.sub(r\"\\b(m\\d+|hol|konkors)\\b\", \" \", ad)\n    ad = re.sub(r\"\\b(kuzey|güney|guney|doğu|dogu|batı|bati)\\b\", \" \", ad)\n    ad = re.sub(r\"-\\s*\\d+$\", \" \", ad)\n    ad = re.sub(r\"(?<=\\D)\\s\\d+(\\s|$)\", \" \", ad)\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()\n    ...", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "<code>\"ISTOÇ\".lower()<\/code> (Python'un kendi fonksiyonu) ne verir?", "opts": ["\"ıstoç\"", "\"istoç\"", "\"ISTOÇ\"", "hata"], "a": 1, "why": "<code>.lower()<\/code> I → i yapar; Türkçe doğrusu \"ıstoç\" olurdu. <code>tr_kucuk<\/code> bunun için var.", "tags": ["turkce", "metin"], "code": null, "rev": false}, {"t": "mc", "q": "<code>re.sub(r\"\\s+\", \" \", \"Hacı    Osman  \").strip()<\/code> ne verir?", "opts": ["\"Hacı Osman\"", "\"HacıOsman\"", "\"Hacı    Osman\"", "\"Hacı Osman \""], "a": 0, "why": "<code>\\s+<\/code> art arda boşlukları tek boşluğa indirir, <code>.strip()<\/code> baştaki/sondaki boşluğu siler.", "tags": ["regex"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>temizle(ad)<\/code> fonksiyonu yaz: parantez içini sil (<code>re.sub(r\"\\(.*?\\)\", \" \", ad)<\/code>), fazla boşlukları teke indir ve baştan/sondan boşluğu at.", "starter": "import re\n\ndef temizle(ad):\n    # buraya yaz\n    return ad\n", "sol": "import re\n\ndef temizle(ad):\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()\n    return ad", "test": "assert temizle(\"Kadıköy (Doğu)\") == \"Kadıköy\", repr(temizle(\"Kadıköy (Doğu)\"))\nassert temizle(\"Şişli (M2)  Mecidiyeköy\") == \"Şişli Mecidiyeköy\", repr(temizle(\"Şişli (M2)  Mecidiyeköy\"))", "hint": "İk n.loads(metin)[\"yolcu\"]", "test": "assert sayi == 23301956, f\"sayi 23301956 olmalı, şu an {sayi!r}\"", "hint": "<code>json.loads(metin)<\/code> bir sözlük döndürür; sonra <code>[\"yolcu\"]<\/code>.", "tags": ["json"], "setup": [], "rev": false, "why": ""}, {"t": "fill", "q": "Dosya doğrudan çalıştırıldığında <code>main()<\/code> çağrılsın.", "code": "if ___ == \"___\":\n    main()", "a": [["__name__"], ["__main__"]], "why": "Python çalıştırılan dosyaya <code>__name__ = \"__main__\"<\/code> der.", "tags": ["script"], "rev": false}, {"t": "mc", "q": "<code>Path(\"harita\") / \"data\" / \"istasyonlar.json\"<\/code> neyi temsil eder?", "opts": ["Bir bölme işlemi", "harita/data/istasyonlar.json yolu", "Hata", "Üç ayrı dosya"], "a": 1, "why": "<code>pathlib<\/code>'te <code>/<\/code> yol parçalarını birleştirir.", "tags": ["dosya"], "code": null, "rev": true}, {"t": "mc", "q": "<code>json.dumps<\/code> ne yapar?", "opts": ["Metni sözlüğe çevirir", "Python nesnesini JSON metnine çevirir", "Dosyayı siler", "İnternetten indirir"], "a": 1, "why": "dumps = dump string; nesne → metin.", "tags": ["json"], "code": null, "rev": true}]}, {"id": "b7", "no": 7, "tur": "ders", "baslik": "pandas 1: veriyi okumak ve temizlemek", "hat": "M7", "ozet": "DataFrame, sütunlar, tarih, maske ve .loc — clean_data.py'nin ilk yarısı.", "anlatim": "\n<p><b>DataFrame<\/b> bir tablodur: satırlar ve adlandırılmış sütunlar. Her sütun bir <b>Series<\/b>'tir.<\/p>\n<pre class=\"py\">import pandas as pd\ndf = pd.read_csv(\"dosya.csv\", sep=\";\", encoding=\"utf-8-sig\")\ndf.shape          # (satır, sütun)\ndf.head()         # ilk 5 satır\ndf[\"line\"]        # bir sütun (Series)\ndf[[\"line\", \"town\"]]   # birden çok sütun (DataFrame)<\/pre>\n<p><code>sep=\";\"<\/code>: İBB dosyaları noktalı virgülle ayrılmış. <code>utf-8-sig<\/code>: dosyanın başındaki görünmez BOM işaretini atar.<\/p>\n<h3>Sütun silmek ve eklemek<\/h3>\n<pre class=\"py\">df = df.drop(columns=[\"longitude\", \"latitude\"])\ndf[\"date\"] = pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))\ndf[\"weekday\"] = df[\"date\"].dt.day_name()      # \"Monday\"...\ndf[\"is_weekend\"] = df[\"date\"].dt.weekday >= 5  # Cumartesi=5, Pazar=6<\/pre>\n<p><code>.dt<\/code> tarih sütunlarının araç kutusudur: <code>.dt.year<\/code>, <code>.dt.month<\/code>, <code>.dt.weekday<\/code>…<\/p>\n<h3>Maske ve .loc<\/h3>\n<p>Bir karşılaştırma her satır için True/False üretir; buna <b>maske<\/b> denir.<\/p>\n<pre class=\"py\">bos = df[\"station_name\"].isna()              # boş olan satırlar\ndf[bos]                                      # sadece onlar\ndf.loc[bos & (df[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"<\/pre>\n<p>Birden çok koşulu <code>&amp;<\/code> (ve) / <code>|<\/code> (veya) ile birleştirirken <b>her koşulu paranteze al<\/b>. <code>df.loc[satır_maskesi, \"sütun\"] = değer<\/code> seçilen hücreleri değiştirir.<\/p>\n", "proje": "df = pd.read_csv(\"2025-yl-...csv\", sep=\";\", encoding=\"utf-8-sig\")\ndf = df.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\ndf[\"date\"]=pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))\ndf[\"weekday\"] = df[\"date\"].dt.day_name()\ndf[\"is_weekend\"] = df[\"date\"].dt.weekday >= 5\nbos_istasyon = df[\"station_name\"].isna()\ndf.loc[bos_istasyon & (df[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"", "dosya": "clean_data.py", "sorular": [{"t": "mc", "q": "<code>df.shape<\/code> <code>(99, 9)<\/code> ise tabloda kaç satır var?", "opts": ["9", "99", "108", "891"], "a": 1, "why": "<code>shape<\/code> = (satır, sütun).", "tags": ["pandas_temel"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> Hazır <code>ham<\/code> tablosunda (temizlenmemiş veri): <code>longitude<\/code>, <code>latitude<\/code>, <code>station_number<\/code> sütunlarını sil, sonra yıl/ay/gün'den <code>date<\/code> sütunu oluştur.", "starter": "# ham tablosu hazır. İlk satırlarına bak:\nprint(ham.head(3))\n\n", "sol": "ham = ham.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\nham[\"date\"] = pd.to_datetime(dict(year=ham.transaction_year, month=ham.transaction_month, day=ham.transaction_day))", "test": "assert \"longitude\" not in ham.columns and \"station_number\" not in ham.columns, \"Koordinat/numara sütunları hâlâ duruyor\"\nassert \"date\" in ham.columns, \"date sütunu yok\"\nassert str(ham[\"date\"].iloc[0].date()) == \"2025-03-03\", \"İlk satırın tarihi 2025-03-03 olmalı\"", "hint": "<code>ham = ham.drop(columns=[...])<\/code> — sonucu tekrar <code>ham<\/code>'a atamayı unutma.", "tags": ["pandas_temel", "tarih"], "setup": ["ham"], "rev": false, "why": ""}, {"t": "code", "q": "<b>Dene:<\/b> <code>ham<\/code> tablosunda <code>station_name<\/code>'i boş olan ve <code>line<\/code>'ı <code>\"T3-KADIKOY-MODA\"<\/code> olan satırın istasyon adını <code>\"Kadıköy-Moda T3\"<\/code> yap.", "starter": "bos = ham[\"station_name\"].isna()\n", "sol": "bos = ham[\"station_name\"].isna()\nham.loc[bos & (ham[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"", "test": "t3 = ham[ham[\"line\"] == \"T3-KADIKOY-MODA\"]\nassert (t3[\"station_name\"] == \"Kadıköy-Moda T3\").all(), \"T3 satırının adı değişmedi\"\nassert ham[\"station_name\"].isna().sum() == 1, \"Sadece T3 satırı değişmeliydi (nostaljik tramvay boş kalmalı)\"", "hint": "<code>ham.loc[bos &amp; (ham[\"line\"] == \"...\"), \"station_name\"] = \"...\"<\/code>", "tags": ["maske", "loc"], "setup": ["ham"], "rev": false, "why": ""}, {"t": "mc", "q": "İki koşulu birleştirmenin doğru yolu hangisi?", "opts": ["df[df[\"a\"] > 1 and df[\"b\"] < 5]", "df[(df[\"a\"] > 1) & (df[\"b\"] < 5)]", "df[df[\"a\"] > 1 & df[\"b\"] < 5]", "df[(df[\"a\"] > 1) and (df[\"b\"] < 5)]"], "a": 1, "why": "pandas'ta <code>and<\/code> yerine <code>&amp;<\/code>, ve her koşul parantez içinde.", "tags": ["maske"], "code": null, "rev": false}, {"t": "fill", "q": "Cumartesi ve Pazar için True olan sütunu oluştur (Pazartesi=0).", "code": "df[\"is_weekend\"] = df[\"date\"].___.weekday >= ___", "a": [["dt"], ["5"]], "why": "Tarih araçları <code>.dt<\/code> altında; Cumartesi 5.", "tags": ["tarih"], "rev": false}, {"t": "mc", "q": "<code>df[\"town\"]<\/code> ne döndürür?", "opts": ["DataFrame", "Series", "list", "str"], "a": 1, "why": "Tek köşeli parantez + tek sütun adı → Series. <code>df[[\"town\"]]<\/code> ise DataFrame.", "tags": ["pandas_temel"], "code": null, "rev": true}, {"t": "mc", "q": "<code>df[\"date\"].dt.weekday<\/code> Pazartesi için kaç verir?", "opts": ["1", "0", "7", "\"Monday\""], "a": 1, "why": "Pazartesi 0, Pazar 6.", "tags": ["tarih"], "code": null, "rev": true}]}, {"id": "t2", "no": 2, "tur": "tekrar", "baslik": "Tekrar durağı 2", "aralik": [3, 4, 5, 6, 7], "adet": 7, "ozet": "Fonksiyonlardan pandas'a: 3–7. bölümler, en çok zorlandığın konular önce."}, {"id": "b8", "no": 8, "tur": "ders", "baslik": "pandas 2: dönüştürmek", "hat": "M8", "ozet": "Kategori sırası, str.extract, replace/fillna ve melt — clean_data.py'nin sonu ve clean_trips.py.", "anlatim": "\n<h3>Sıralı kategori<\/h3>\n<pre class=\"py\">yas_sirasi = [\"&lt;20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\ndf[\"age\"] = pd.Categorical(df[\"age\"], categories=yas_sirasi, ordered=True)<\/pre>\n<p>Yoksa pandas yaşları alfabetik sıralar (\"20-30\", \"30-60\", \"60+\", \"&lt;20\"…). Kategori yaparsan grafik ve tablolar senin sıranla gelir.<\/p>\n<h3>replace ve fillna<\/h3>\n<pre class=\"py\">df[\"age\"] = df[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})   # yazım hatasını düzelt\nseri.fillna(yedek)      # boş (NaN) değerleri doldur<\/pre>\n<h3>str.extract: metinden parça çekmek<\/h3>\n<pre class=\"py\">df[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0]\n# \"M4-KADIKOY-TAVSANTEPE\" → \"M4\"\n# \"TCDD TASIMACILIK A.S.\" → NaN (desene uymuyor)<\/pre>\n<p>Parantezli grup yakalanan parçadır; <code>[0]<\/code> ilk grubu alır. Uymayanlar NaN olur, sen de onları <code>.fillna(df[\"line\"])<\/code> ile hattın tam adıyla doldurmuşsun.<\/p>\n<h3>melt: geniş tablodan uzun tabloya<\/h3>\n<p>Sefer dosyası her hat için ayrı sütun içeriyor (geniş). <code>melt<\/code> bunları iki sütuna indirir: hat adı ve değer.<\/p>\n<pre class=\"py\">Tarih       M2     M4           Tarih       line_code  sefer_sayisi\n2025-03-01  14200  12100   →   2025-03-01  M2         14200\n                               2025-03-01  M4         12100<\/pre>\n<pre class=\"py\">uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")<\/pre>\n", "proje": "df[\"age\"] = df[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})\ndf[\"age\"] = pd.Categorical(df[\"age\"], categories=yas_sirasi, ordered=True)\ndf[\"line_code\"] = df[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].fillna(df[\"line\"])\n...\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\nsefer_uzun[\"sefer_sayisi\"] = sefer_uzun[\"sefer_sayisi\"].astype(int)", "dosya": "clean_data.py · clean_trips.py", "sorular": [{"t": "mc", "q": "<code>str.extract(r\"^([A-Z]+\\d+)\")<\/code> <code>\"TF1-MACKA-TASKISLA\"<\/code> için ne çıkarır?", "opts": ["\"T\"", "\"TF1\"", "\"TF\"", "NaN"], "a": 1, "why": "<code>[A-Z]+<\/code> TF'yi, <code>\\d+<\/code> 1'i yakalar.", "tags": ["regex", "pandas_metin"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>ham<\/code> tablosunda <code>line_code<\/code> sütunu oluştur: <code>str.extract<\/code> ile kodu çek, uymayanları <code>line<\/code> ile doldur, sonra <code>\"TCDD TASIMACILIK A.S.\"<\/code>'ı <code>\"Marmaray\"<\/code> yap.", "starter": "ham[\"line_code\"] = ham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0]\n", "sol": "ham[\"line_code\"] = ham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].fillna(ham[\"line\"])\nham[\"line_code\"] = ham[\"line_code\"].replace({\"TCDD TASIMACILIK A.S.\": \"Marmaray\"})", "test": "kodlar = list(ham[\"line_code\"])\nassert kodlar[0] == \"M4\", \"İlk satır M4 olmalı\"\nassert \"Marmaray\" in kodlar, \"TCDD TASIMACILIK A.S. → Marmaray yapılmadı\"\nassert ham[\"line_code\"].isna().sum() == 0, \"Boş (NaN) line_code kaldı; fillna kullan\"", "hint": "<code>.fillna(ham[\"line\"])<\/code> sonra <code>.replace({...: \"Marmaray\"})<\/code>", "tags": ["pandas_metin", "fillna"], "setup": ["ham"], "rev": false, "why": ""}, {"t": "code", "q": "<b>Dene:<\/b> <code>sefer<\/code> geniş tablosunu <code>melt<\/code> ile uzun hâle getir (<code>sefer_uzun<\/code>), boş sefer sayılarını at ve sayıları int yap.", "starter": "print(sefer)\nsefer_uzun = \n", "sol": "sefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\nsefer_uzun[\"sefer_sayisi\"] = sefer_uzun[\"sefer_sayisi\"].astype(int)", "test": "assert list(sefer_uzun.columns) == [\"Tarih\", \"line_code\", \"sefer_sayisi\"], f\"Sütunlar: {list(sefer_uzun.columns)}\"\nassert len(sefer_uzun) == 11, f\"Boşlar atılınca 11 satır kalmalı, şu an {len(sefer_uzun)}\"\nassert str(sefer_uzun[\"sefer_sayisi\"].dtype).startswith(\"int\"), \"sefer_sayisi int olmalı\"", "hint": "<code>sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")<\/code>", "tags": ["melt", "fillna"], "setup": ["sefer"], "rev": false, "why": ""}, {"t": "mc", "q": "Yaş sütununu neden <code>Categorical(..., ordered=True)<\/code> yaptın?", "opts": ["Bellek için", "Tablolarda/grafiklerde yaşların mantıklı sırayla gelmesi için", "Hataları silmek için", "Sayıya çevirmek için"], "a": 1, "why": "Alfabetik sırada \"&lt;20\" en sona düşerdi.", "tags": ["kategori"], "code": null, "rev": false}, {"t": "order", "q": "<code>clean_trips.py<\/code>'nin satırlarını sıraya koy.", "lines": ["sefer = pd.read_excel(\"sefer.xlsx\")", "uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")", "uzun = uzun.dropna(subset=[\"sefer_sayisi\"])", "uzun[\"sefer_sayisi\"] = uzun[\"sefer_sayisi\"].astype(int)", "uzun.to_csv(\"trips_clean.csv\", index=False, sep=\";\")"], "why": "Oku → uzun hâle getir → boşları at → tipi düzelt → kaydet. NaN varken <code>astype(int)<\/code> hata verirdi; bu yüzden dropna önce.", "tags": ["melt"], "rev": false}, {"t": "mc", "q": "Bir sütunda NaN varken <code>.astype(int)<\/code> çağırırsan ne olur?", "opts": ["NaN 0 olur", "Hata verir", "NaN silinir", "Hiçbir şey"], "a": 1, "why": "Tamsayı tipi NaN tutamaz; önce <code>dropna<\/code> veya <code>fillna<\/code>.", "tags": ["fillna"], "code": null, "rev": true}, {"t": "mc", "q": "<code>melt<\/code> sonrası tablo nasıl değişir?", "opts": ["Daha geniş ve kısa", "Daha uzun ve dar", "Aynı kalır", "Sütunlar silinir"], "a": 1, "why": "Her hat sütunu satırlara dönüşür.", "tags": ["melt"], "code": null, "rev": true}]}, {"id": "b9", "no": 9, "tur": "ders", "baslik": "Gruplama: groupby", "hat": "M9", "ozet": "Hat ve istasyon bazında toplamlar, sıralama ve pay hesabı.", "anlatim": "\n<p><code>groupby<\/code> üç adımda çalışır: <b>böl<\/b> (aynı değerli satırları grupla) → <b>uygula<\/b> (sum, mean…) → <b>birleştir<\/b>.<\/p>\n<pre class=\"py\">hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nhat_yolcu.sort_values(ascending=False)   # büyükten küçüğe\nhat_yolcu.head(3)                         # ilk 3<\/pre>\n<p>Birden çok sütunla gruplarsan sonuç <b>çok seviyeli<\/b> index olur:<\/p>\n<pre class=\"py\">yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\n# (M2, Taksim)  ...\n# (M2, Yenikapı) ...<\/pre>\n<h3>Pay (%)<\/h3>\n<pre class=\"py\">pay = hat_yolcu / hat_yolcu.sum() * 100<\/pre>\n<p>Series'i tek bir sayıya bölmek her elemanı böler. Birden çok sütunu birlikte toplamak için: <code>groupby(...)[[\"passage_cnt\", \"passanger_cnt\"]].sum()<\/code>.<\/p>\n<h3>Benzersiz sayısı<\/h3>\n<pre class=\"py\">yolcu[\"station_name\"].nunique()      # kaç farklı istasyon adı\nyolcu.groupby(\"transaction_month\")[\"date\"].nunique()   # her ayda kaç farklı gün<\/pre>\n", "proje": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)\npay = hat_yolcu / hat_yolcu.sum() * 100\nilk = pay.sort_values(ascending=False).head(6)\ndiger = pay.drop(ilk.index)\npasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])", "dosya": "analiz.ipynb", "sorular": [{"t": "code", "q": "<b>Dene:<\/b> <code>yolcu<\/code> tablosunda hat başına toplam <code>passanger_cnt<\/code>'yi hesapla, büyükten küçüğe sırala ve <code>hat_yolcu<\/code>'ya ata.", "starter": "print(yolcu.head())\nhat_yolcu = \n", "sol": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)", "test": "assert list(hat_yolcu.index[:2]) == [\"M2\", \"Marmaray\"], f\"İlk iki hat M2 ve Marmaray olmalı: {list(hat_yolcu.index[:2])}\"\nassert hat_yolcu.index[-1] == \"TF1\", \"En sonda TF1 olmalı\"\nassert int(hat_yolcu.sum()) == int(yolcu[\"passanger_cnt\"].sum()), \"Toplam tutmuyor\"", "hint": "<code>yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()<\/code>, sonra <code>.sort_values(ascending=False)<\/code>", "tags": ["groupby", "sort"], "setup": ["yolcu"], "rev": false, "why": ""}, {"t": "code", "q": "<b>Dene:<\/b> Her hattın toplam yolcu içindeki payını (%) hesapla (<code>pay<\/code>), bir basamağa yuvarla.", "starter": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = \n", "sol": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = (hat_yolcu / hat_yolcu.sum() * 100).round(1)", "test": "assert abs(pay.sum() - 100) < 0.5, f\"Payların toplamı ~100 olmalı, şu an {pay.sum()}\"\nassert pay.idxmax() == \"M2\", \"En büyük pay M2'de olmalı\"", "hint": "<code>hat_yolcu / hat_yolcu.sum() * 100<\/code>, sonra <code>.round(1)<\/code>", "tags": ["groupby", "pay"], "setup": ["yolcu"], "rev": false, "why": ""}, {"t": "mc", "q": "<code>yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()<\/code> sonucunun index'i nasıldır?", "opts": ["Tek seviye: hat", "İki seviye: (hat, istasyon)", "0, 1, 2...", "Sütun adları"], "a": 1, "why": "Birden çok sütunla gruplama çok seviyeli index (MultiIndex) üretir.", "tags": ["groupby"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> Her ayda (<code>transaction_month<\/code>) kaç farklı gün (<code>date<\/code>) olduğunu bul: <code>gun_sayisi<\/code>.", "starter": "gun_sayisi = \n", "sol": "gun_sayisi = yolcu.groupby(\"transaction_month\")[\"date\"].nunique()", "test": "assert gun_sayisi.to_dict() == {3: 2, 10: 1}, f\"Mart 2, Ekim 1 gün olmalı: {gun_sayisi.to_dict()}\"", "hint": "<code>.nunique()<\/code> benzersiz değer sayısıdır.", "tags": ["groupby", "nunique"], "setup": ["yolcu"], "rev": false, "why": ""}, {"t": "fill", "q": "En büyük 6 hattı al, kalanları çıkar.", "code": "ilk = pay.sort_values(ascending=___).head(___)\ndiger = pay.drop(ilk.index)", "a": [["False"], ["6"]], "why": "Büyükten küçüğe için <code>ascending=False<\/code>.", "tags": ["sort"], "rev": false}, {"t": "mc", "q": "<code>seri / seri.sum()<\/code> ne yapar?", "opts": ["Tek bir sayı verir", "Her elemanı toplama böler (paylar)", "Hata verir", "Seriyi sıralar"], "a": 1, "why": "Series ile sayı arasındaki işlem her elemana uygulanır.", "tags": ["pay"], "code": null, "rev": true}, {"t": "mc", "q": "<code>.sort_values()<\/code> varsayılan olarak nasıl sıralar?", "opts": ["Büyükten küçüğe", "Küçükten büyüğe", "Alfabetik", "Rastgele"], "a": 1, "why": "Varsayılan <code>ascending=True<\/code>.", "tags": ["sort"], "code": null, "rev": true}]}, {"id": "b10", "no": 10, "tur": "ders", "baslik": "Birleştirme ve pivot", "hat": "M11", "ozet": "merge ile iki tabloyu eşleştirmek, pivot_table ve unstack ile tabloyu çevirmek.", "anlatim": "\n<h3>merge<\/h3>\n<p>İki tabloyu ortak sütunlara göre yan yana getirir (Excel'deki DÜŞEYARA gibi).<\/p>\n<pre class=\"py\">birlesik = aylik_yolcu.merge(sefer_20 color=renkler)\nfor i, deger in enumerate(veri):\n    ax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)\nax.spines[[\"top\", \"right\"]].set_visible(False)\nax.legend(handles=[Patch(color=TUR_RENK[tur], label=tur) for tur in turler], loc=\"lower right\", frameon=False)\nbaslik_ekle(ax, \"2025'te hat bazında yıllık yolcu\", \"İstasyona giriş yapan yolcu sayısı\")\nfooter_ekle(fig, \"2025\", \"yolcu (milyon)\")\nplt.savefig(\"figures/hat_bazli_yolcu.png\", dpi=150)", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "<code>fig, ax = plt.subplots()<\/code> satırında <code>ax<\/code> nedir?", "opts": ["Tüm pencere", "Çizim yapılan grafik alanı (eksen)", "Renk listesi", "Dosya adı"], "a": 1, "why": "Çubuklar, yazılar, etiketler hep <code>ax<\/code> üzerinden eklenir.", "tags": ["grafik"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> Hat başına toplam yolcuyu yatay çubuk grafikle çiz; her çubuğun ucuna değeri yaz; üst ve sağ çerçeveyi kaldır. Grafik aşağıda görünecek.", "starter": "import matplotlib.pyplot as plt\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values()\n\nfig, ax = plt.subplots(figsize=(7, 4))\n", "sol": "import matplotlib.pyplot as plt\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values()\n\nfig, ax = plt.subplots(figsize=(7, 4))\nax.barh(veri.index, veri.values, color=\"#3b6ea5\")\nfor i, deger in enumerate(veri.values):\n    ax.text(deger + 300, i, f\"{deger:,}\", va=\"center\", fontsize=8)\nax.spines[[\"top\", \"right\"]].set_visible(False)\nax.set_xlabel(\"Yolcu\")", "test": "assert len(ax.patches) == 5, f\"5 çubuk olmalı, şu an {len(ax.patches)}\"\nassert len(ax.texts) >= 5, \"Her çubuğa bir yazı ekle (ax.text)\"\nassert not ax.spines[\"top\"].get_visible() and not ax.spines[\"right\"].get_visible(), \"Üst ve sağ çerçeve görünmez olmalı\"", "hint": "<code>ax.barh(veri.index, veri.values)<\/code>, <code>for i, deger in enumerate(veri.values): ax.text(...)<\/code>, <code>a robust_z = 0.6745 * (bugun - m) / mad<\/pre>\n<p><code>0.6745<\/code> çarpanı, MAD'i normal dağılımdaki standart sapmayla aynı ölçeğe getirir. Kuralın: <code>|robust_z| &gt; 3.5<\/code> <b>ve<\/b> <code>|sapma| &gt; %5<\/code> ise anomali. İkinci koşul, çok istikrarlı hatlarda küçük ama \"istatistiksel olarak büyük\" sapmaları eler.<\/p>\n", "proje": "def referans_hesapla(seri, hafta=4):\n    medyanlar, madlar, n_ler = [], [], []\n    for tarih in seri.index:\n        komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n        degerler = seri.reindex(komsular).dropna()\n        m = degerler.median()\n        medyanlar.append(m)\n        madlar.append((degerler - m).abs().median())\n        ...\ngunluk[\"robust_z\"] = 0.6745 * (gunluk[\"yolcu\"] - gunluk[\"referans\"]) / gunluk[\"mad\"]\ngunluk[\"anomali\"] = (gunluk[\"robust_z\"].abs() > 3.5) & (gunluk[\"sapma_yuzde\"].abs() > 5)", "dosya": "analiz.ipynb", "sorular": [{"t": "mc", "q": "<code>[1, 2, 3, 100]<\/code> için ortalama ve medyan?", "opts": ["26.5 ve 2.5", "26.5 ve 3", "2.5 ve 2.5", "100 ve 2"], "a": 0, "why": "Ortalama uç değer (100) yüzünden 26.5; medyan ortadaki iki değerin ortalaması: 2.5.", "tags": ["istatistik"], "code": null, "rev": false}, {"t": "mc", "q": "<code>[k for k in range(-2, 3) if k != 0]<\/code> neyi verir?", "opts": ["[-2, -1, 0, 1, 2]", "[-2, -1, 1, 2]", "[-1, 1]", "[1, 2]"], "a": 1, "why": "<code>range(-2, 3)<\/code> → -2..2; 0 atılır.", "tags": ["comprehension", "zaman"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> <code>salilar<\/code> serisi bir hattın 9 haftalık Salı yolcusu (bin). 5. hafta (2025-04-01) için komşu 4'er haftadan medyan (<code>m<\/code>), MAD (<code>mad<\/code>) ve robust z (<code>z<\/code>) hesapla.", "starter": "print(salilar)\nhedef = pd.Timestamp(\"2025-04-01\")\nkomsular = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\ndegerler = salilar.reindex(komsular).dropna()\n\nm = \nmad = \nz = \n", "sol": "hedef = pd.Timestamp(\"2025-04-01\")\nkomsular = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\ndegerler = salilar.reindex(komsular).dropna()\nm = degerler.median()\nmad = (degerler - m).abs().median()\nz = 0.6745 * (salilar[hedef] - m) / mad", "test": "assert len(degerler) == 8, \"8 komşu olmalı\"\nassert m == 406.5, f\"Medyan 406.5 olmalı, şu an {m}\"\nassert abs(mad - 5.0) < 1e-9, f\"MAD 5.0 olmalı, şu an {mad}\"\nassert z < -3.5, f\"Bayram günü güçlü negatif z vermeli, şu an {z:.1f}\"", "hint": "<code>m = degerler.median()<\/code>, <code>mad = (degerler - m).abs().median()<\/code>, <code>z = 0.6745 * (salilar[hedef] - m) / mad<\/code>", "tags": ["zaman", "istatistik"], "setup": ["salilar"], "rev": false, "why": ""}, {"t": "fill", "q": "Anomali kuralını yaz: iki koşul da sağlanmalı.", "code": "gunluk[\"anomali\"] = (gunluk[\"robust_z\"].___() > 3.5) ___ (gunluk[\"sapma_yuzde\"].abs() > 5)", "a": [["abs"], ["&"]], "why": "Mutlak değer <code>.abs()<\/code>; pandas'ta \"ve\" <code>&amp;<\/code>.", "tags": ["maske", "zaman"], "rev": false}, {"t": "mc", "q": "Neden <code>seri.reindex(komsular)<\/code> ve ardından <code>.dropna()<\/code>?", "opts": ["Sıralamak için", "Veride olmayan tarihler (yıl başı/sonu) NaN olur; onları atmak için", "Tarihleri stringe çevirmek için", "Gereksiz"], "a": 1, "why": "Ocak başındaki bir günün 4 hafta öncesi veride yok; <code>reindex<\/code> onu NaN yapar.", "tags": ["zaman"], "code": null, "rev": false}, {"t": "mc", "q": "Medyan neden ortalamadan daha uygun referans?", "opts": ["Daha hızlı hesaplanır", "Tek bir uç değerden (bayram) etkilenmez", "Her zaman daha büyüktür", "pandas ortalama hesaplayamaz"], "a": 1, "why": "Dayanıklı (robust) istatistik.", "tags": ["istatistik"], "code": null, "rev": true}]}, {"id": "b13", "no": 13, "tur": "ders", "baslik": "İstatistik: ilişki var mı?", "hat": "T5", "ozet": "Spearman korelasyonu, permütasyon testi, bootstrap güven aralığı ve ekolojik yanılgı.", "anlatim": "\n<h3>Spearman korelasyonu<\/h3>\n<p>İki değişkenin <b>sıraları<\/b> arasındaki ilişki: biri artarken diğeri de artıyor mu? -1 ile +1 arası. Uç değerlere dayanıklıdır, ilişkinin doğrusal olmasını istemez.<\/p>\n<pre class=\"py\">from scipy import stats\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])<\/pre>\n<h3>Permütasyon testi<\/h3>\n<p>\"Hiç ilişki olmasaydı bu kadar güçlü bir ρ'yu şans eseri ne sıklıkla görürdüm?\" Bir sütunu rastgele karıştırıp korelasyonu binlerce kez hesaplarsın:<\/p>\n<pre class=\"py\">rng = np.random.default_rng(42)       # 42 → her çalıştırmada aynı sonuç\nperm = [np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(10_000)]\np_perm = (np.abs(perm) &gt;= abs(rho)).mean()<\/pre>\n<h3>Bootstrap güven aralığı<\/h3>\n<p>Hatları <b>iadeli<\/b> olarak yeniden örnekleyip ρ'yu tekrar tekrar hesaplarsın; sonuçların %2.5 ve %97.5 yüzdelikleri %95 güven aralığıdır.<\/p>\n<h3>Ekolojik yanılgı<\/h3>\n<p>Veri <b>hat düzeyinde<\/b>. \"60+ payı yüksek hatlar hafta sonu daha dolu\" diyebilirsin; \"yaşlılar hafta sonu daha çok yolculuk yapar\" diyemezsin. Grup düzeyindeki ilişki bireylere aktarılamaz.<\/p>\n", "proje": "rho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nrng = np.random.default_rng(42)\nx_sira, y_sira = iliski[\"pay_60\"].rank().values, iliski[\"hafta_sonu\"].rank().values\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(10_000)])\np_perm = (np.abs(perm) >= abs(rho)).mean()\n...\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])", "dosya": "analiz.ipynb", "sorular": [{"t": "code", "q": "<b>Dene:<\/b> <code>iliski<\/code> tablosunda (8 hat) 60+ payı ile hafta sonu oranı arasındaki Spearman korelasyonunu hesapla: <code>rho, p<\/code>.", "starter": "from scipy import stats\nprint(iliski)\nrho, p = \n", "sol": "from scipy import stats\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])", "test": "assert 0.9 < rho <= 1, f\"rho yaklaşık 0.95 olmalı, şu an {rho:.2f}\"\nassert p < 0.01, \"p değeri 0.01'den küçük olmalı\"", "hint": "<code>stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])<\/code> iki değer döndürür.", "tags": ["istatistik"], "setup": ["iliski"], "rev": false, "why": ""}, {"t": "code", "q": "<b>Dene:<\/b> Permütasyon testini yaz: <code>hafta_sonu<\/code> sıralarını 2000 kez karıştır, her seferinde sıra korelasyonunu hesapla; gözlenenden büyük/eşit olanların oranını <code>p_perm<\/code>'e ata.", "starter": "import numpy as np\nfrom scipy import stats\nrho = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])[0]\nrng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\n\nperm = \np_perm = \n", "sol": "import numpy as np\nfrom scipy import stats\nrho = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])[0]\nrng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(2000)])\np_perm = (np.abs(perm) >= abs(rho)).mean()", "test": "assert len(perm) == 2000, f\"2000 permütasyon olmalı, şu an {len(perm)}\"\nassert p_perm < 0.01, f\"p_perm çok küçük olmalı, şu an {p_perm}\"", "hint": "<code>np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(2000)])<\/code>, sonra <code>(np.abs(perm) &gt;= abs(rho)).mean()<\/code>", "tags": ["istatistik", "comprehension"], "setup": ["iliski"], "rev": false, "why": ""}, {"t": "mc", "q": "ρ = 0.62 ve hat düzeyinde veri. Hangi cümle <b>doğru<\/b>?", "opts": ["Yaşlılar hafta sonu daha çok metroya biner", "60+ payı yüksek hatların hafta sonu kullanımı da görece yüksek", "60+ yolcu hafta sonu oranını artırır", "İlişki kesinlikle nedenseldir"], "a": 1, "why": "Hat düzeyinde ilişki; bireylere veya nedenselliğe genellenemez (ekolojik yanılgı).", "tags": ["istatistik"], "code": null, "rev": false}, {"t": "mc", "q": "<code>np.random.default_rng(42)<\/code>'deki 42 ne işe yarar?", "opts": ["Tekrar sayısı", "Aynı rastgele sayıların her çalıştırmada üretilmesi (tekrarlanabilirlik)", "Güven düzeyi", "Hat sayısı"], "a": 1, "why": "Tohum (seed) sabitlenince sonuçlar değişmez.", "tags": ["istatistik"], "code": null, "rev": false}, {"t": "mc", "q": "Bootstrap'te örnekleme nasıl yapılır?", "opts": ["İadesiz, yarısı alınır", "İadeli, aynı büyüklükte", "Sadece uç değerler", "Sıralı"], "a": 1, "why": "Bir hat birden çok kez seçilebilir; örneklem boyu aynı kalır.", "tags": ["istatistik"], "code": null, "rev": true}, {"t": "mc", "q": "Spearman korelasyonu neyi kullanır?", "opts": ["Ham değerleri", "Sıraları (rank)", "Ortalamaları", "Logaritmaları"], "a": 1, "why": "Değerler önce sıraya çevrilir.", "tags": ["istatistik"], "code": null, "rev": true}]}, {"id": "b14", "no": 14, "tur": "ders", "baslik": "build_map.py: özyineleme ve çizgi sadeleştirme", "hat": "Marmaray", "ozet": "Kendini çağıran fonksiyon ile Douglas–Peucker algoritması.", "anlatim": "\n<p>OSM'den gelen ray çizgisinde binlerce nokta var. Haritada fark edilmeyecek kadar küçük kıvrımları atmak için <b>Douglas–Peucker<\/b> kullanılıyor:<\/p>\n<ol>\n<li>İlk ve son noktayı düz çizgiyle birleştir.<\/li>\n<li>Bu çizgiye <b>en uzak<\/b> ara noktayı bul.<\/li>\n<li>Uzaklık toleranstan küçükse ara noktaların hepsini at: sadece iki uç kalır.<\/li>\n<li>Değilse çizgiyi o noktadan ikiye böl ve <b>her iki yarıya aynı işlemi uygula<\/b>.<\/li>\n<\/ol>\n<p>4. adımda fonksiyon kendini çağırır: buna <b>özyineleme<\/b> (recursion) denir. Her özyinelemeli fonksiyonun bir <b>durma koşulu<\/b> olmalı; burada \"2'den az ara nokta\" ve \"tolerans altında\".<\/p>\n<pre class=\"py\">def faktoriyel(n):\n    if n &lt;= 1:            # durma koşulu\n        return 1\n    return n * faktoriyel(n - 1)<\/pre>\n<p>İki yarıyı birleştirirken <code>[:-1]<\/code> ile ilk yarının son noktası atılıyor; çünkü o nokta ikinci yarının ilk noktası, yoksa iki kez yazılırdı.<\/p>\n", "proje": "def sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    ...\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)", "dosya": "harita/build_map.py", "sorular": [{"t": "mc", "q": "<code>faktoriyel(4)<\/code> kaç döner?", "opts": ["4", "10", "24", "sonsuz döngü"], "a": 2, "why": "4 × 3 × 2 × 1 = 24.", "tags": ["ozyineleme"], "code": null, "rev": false}, {"t": "mc", "q": "Durma koşulu olmayan özyinelemeli fonksiyonda ne olur?", "opts": ["Normal biter", "Kendini sonsuza kadar çağırır, RecursionError", "0 döner", "Python otomatik durdurup doğru sonucu verir"], "a": 1, "why": "Python belli bir derinlikte <code>RecursionError<\/code> verir.", "tags": ["ozyineleme"], "code": null, "rev": false}, {"t": "code", "q": "<b>Dene:<\/b> Bir listedeki sayıların toplamını <b>döngü kullanmadan<\/b>, özyinelemeyle hesaplayan <code>toplam(liste)<\/code> yaz.", "starter": "def toplam(liste):\n    # boş liste → 0\n    # değilse: ilk eleman + geri kalanının toplamı\n    pass\n", "sol": "def toplam(liste):\n    if not liste:\n        return 0\n    return liste[0] + toplam(liste[1:])", "test": "assert toplam([]) == 0, \"Boş liste 0 vermeli\"\nassert toplam([5, 3, 2]) == 10, f\"[5, 3, 2] → 10 olmalı, şu an {toplam([5, 3, 2])}\"\nassert \"for \" not in __kod__ and \"sum(\" not in __kod__, \"for veya sum kullanmadan yaz\"", "hint": "<code>if not liste: return 0<\/code> ve <code>return liste[0] + toplam(liste[1:])<\/code>", "tags": ["ozyineleme", "dilim"], "setup": [], "rev": false, "why": ""}, {"t": "code", "q": "<b>Dene:<\/b> Douglas–Peucker'ı tamamla. Hazır <code>uzaklik(p, a, b)<\/code> noktanın a–b doğrusuna uzaklığını veriyor.", "starter": "def uzaklik(p, a, b):\n    (x, y), (x1, y1), (x2, y2) = p, a, b\n    dx, dy = x2 - x1, y2 - y1\n    return abs(dy * x - dx * y + x2 * y1 - y2 * x1) / (dx * dx + dy * dy) ** 0.5\n\ndef sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    uzakliklar = [uzaklik(p, noktalar[0], noktalar[-1]) for p in noktalar[1:-1]]\n    en_uzak = max(uzakliklar)\n    indeks = uzakliklar.index(en_uzak) + 1\n    # tolerans altındaysa: sadece iki uç\n    # değilse: iki yarıyı sadeleştirip birleştir\n", "sol": "def uzaklik(p, a, b):\n    (x, y), (x1, y1), (x2, y2) = p, a, b\n    dx, dy = x2 - x1, y2 - y1\n    return abs(dy * x - dx * y + x2 * y1 - y2 * x1) / (dx * dx + dy * dy) ** 0.5\n\ndef sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    uzakliklar = [uzaklik(p, noktalar[0], noktalar[-1]) for p in noktalar[1:-1]]\n    en_uzak = max(uzakliklar)\n    indeks = uzakliklar.index(en_uzak) + 1\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)", "test": "hat = [(0, 0), (1, 0.05), (2, -0.03), (3, 0), (4, 2), (5, 4), (6, 4.02), (7, 4)]\nsonuc = sadelestir(hat, 0.1)\nassert sonuc == [(0, 0), (3, 0), (5, 4), (7, 4)], f\"Beklenen [(0,0),(3,0),(5,4),(7,4)], senin sonucun {sonuc}\"\nassert sadelestir([(0, 0), (1, 1)], 0.1) == [(0, 0), (1, 1)], \"İki nokta aynen dönmeli\"", "hint": "<code>if en_uzak &lt;= tol: return [noktalar[0], noktalar[-1]]<\/code>, sonra <code>return sadelestir(noktalar[:indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)<\/code>", "tags": ["ozyineleme", "dilim"], "setup": [], "rev": false, "why": ""}, {"t": "mc", "q": "Birleştirirken ilk yarıya neden <code>[:-1]<\/code> uygulanıyor?", "opts": ["Son noktayı gizlemek için", "Bölme noktası iki yarıda da var; iki kez yazılmasın diye", "Listeyi ters çevirmek için", "Hata vermesin diye"], "a": 1, "why": "Ortadaki nokta ilk yarının sonu ve ikinci yarının başı.", "tags": ["dilim", "ozyineleme"], "code": null, "rev": false}, {"t": "mc", "q": "<code>\"--yenile\" in sys.argv<\/code> ne kontrol eder?", "opts": ["Dosya var mı", "Komut satırında --yenile yazılmış mı", "İnt   const re = /(#[^\n]*)|([rfb]{0,2}"""[\s\S]*?"""|[rfb]{0,2}'''[\s\S]*?'''|[rfb]{0,2}"(?:\\.|[^"\\\n])*"|[rfb]{0,2}'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*\.?\d*(?:e-?\d+)?\b)|([A-Za-z_ğüşıöçĞÜŞİÖÇ][\wğüşıöçĞÜŞİÖÇ]*)(?=\s*\()|([A-Za-z_ğüşıöçĞÜŞİÖÇ][\wğüşıöçĞÜŞİÖÇ]*)/g;
  let out = "", son = 0, m;
  while ((m = re.exec(kod))) {
    out += kacis(kod.slice(son, m.index)); son = re.lastIndex;
    const [t, com, str, num, fn, id] = m;
    if (com) out += `<span class="t-com">${kacis(com)}</span>`;
    else if (str) out += `<span class="t-str">${kacis(str)}</span>`;
    else if (num) out += `<span class="t-num">${num}</span>`;
    else if (fn) out += KW.has(fn) ? `<span class="t-kw">${fn}</span>` : `<span class="t-fn">${fn}</span>`;
    else out += KW.has(id) ? `<span class="t-kw">${id}</span>` : kacis(id);
  }
  return out + kacis(kod.slice(son));
}
function renklendirHepsi(kok) {
  kok.querySelectorAll("pre.py").forEach(p => { if (!p.dataset.r) { p.innerHTML = renklendir(p.textContent); p.dataset.r = 1; } });
}

const PYO = "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/";

function pyDurum(s, metin) { const b = document.getElementById("pybar"); b.dataset.s = s; document.getElementById("pytxt").textContent = metin; document.getElementById("pyload").hidden = s !== "yok" && s !== "hata"; }
function pyHazirla() {
  if (py) return Promise.resolve(py);

  pyDurum("yukleniyor", "Python yükleniyor… (ilk sefer ~20 sn)");
  pyYukleniyor = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = PYO + "pyodide.js";
    s.onload = async () => {

        pyDurum("hazir", "Python hazır"); ok(py);

    };

const GRAFIK_ON = 'import matplotlib\nmatplotlib.use("Agg")\nimport matplotlib.pyplot as plt\nplt.show = lambda *a, **k: None\n';
const GRAFIK_SON = 'import sys, io, base64\n__figler = []\nif "matplotlib.pyplot" in sys.modules:\n    import matplotlib.pyplot as _plt\n    for _n in _plt.get_fignums():\n        _b = io.BytesIO(); _plt.figure(_n).savefig(_b, format="png", dpi=110, bbox_inches="tight"); __figler.append(base64.b64encode(_b.getvalue()).decode())\n    _plt.close("all")\n__figler';
async function calistir(kod, setup = [], test = null) {
  const p = await pyHazirla();
  const kurulum = setup.map(k => C.kurulum[k]).join("\n");
  const grafik = /matplotlib|plt\./.test(kod);
  await p.loadPackagesFromImports(kurulum + "\n" + kod + (grafik ? "\nimport matplotlib" : "") + (test && /scipy|stats/.test(kod) ? "\nimport scipy" : ""));
  const ns = p.globals.get("dict")();
  for (const k of Object.keys(C.veriler)) ns.set(k, p.globals.get(k));
  ns.set("__kod__", kod);
  let cikti = ""; p.setStdout({ batched: s => { cikti += s + "\n"; } }); p.setStderr({ batched: s => { cikti += s + "\n"; } });
  const sonuc = { cikti: "", hata: null, test: null, figler: [] };
  try {
    if (grafik) await p.runPythonAsync(GRAFIK_ON, { globals: ns });
    if (kurulum) await p.runPythonAsync(kurulum, { globals: ns });
    await p.runPythonAsync(kod, { globals: ns });
    ns.set("__cikti__", cikti);
    if (test) {
      try { await p.runPythonAsync(test, { globals: ns }); sonuc.test = { ok: true }; }
      catch (e) { sonuc.test = { ok: false, mesaj: hataOzet(e, true) }; }
    }
  } catch (e) { sonuc.hata = hataOzet(e); }
  try { const f = await p.runPythonAsync(GRAFIK_SON, { globals: ns }); sonuc.figler = f.toJs ? f.toJs() : []; } catch (e) {}
  sonuc.cikti = cikti; ns.destroy();
  return sonuc;
}
function hataOzet(e, test) {
  const m = String(e && e.message || e).trim().split("\n");
  const son = m[m.length - 1] || "Hata";
  if (test && son.startsWith("AssertionError")) return son.replace(/^AssertionError:?\s*/, "") || "Sonuç beklenenle aynı değil.";
  const satir = m.reverse().find(l => /File "<exec>", line \d+/.test(l));
  const ipucu = { NameError: "Bu isim tanımlı değil; yazımı ya da tanımlandığı satırı kontrol et.", SyntaxError: "Yazım hatası: parantez, tırnak veya iki nokta eksik olabilir.",
    IndentationError: "Girinti hatası: blok içindeki satırlar aynı miktarda (4 boşluk) içeride olmalı.", KeyError: "Olmayan bir anahtar/sütun adı istendi.",
    TypeError: "Yanlış tipte değerle işlem yapılıyor.", AttributeError: "Bu nesnede böyle bir özellik/yöntem yok." };
  const tip = (son.match(/^(\w+Error)/) || [])[1];
  return son + (satir ? `  (${satir.trim().replace(/File "<exec>", /, "")})` : "") + (ipucu[tip] ? `\n→ ${ipucu[tip]}` : "");
}

    <div class="row"><a class="btn ana" href="#${devam.id}" style="text-decoration:none">${cozulen ? "Kaldığın yerden devam et" : "Birinci duraktan başla"} → ${devam.baslik}</a><a class="btn" href="#deneme" style="text-decoration:none">Deneme tahtası</a></div></section>
    <div class="stats"><div class="stat"><b>${cozulen}/${toplam}</b><span>durak sorusu çözüldü</span></div>
      <div class="stat"><b>${deneme ? Math.round(dogru / deneme * 100) : 0}%</b><span>tüm denemelerde isabet</span></div>
      <div class="stat"><b>${dersler.filter(b => bolumDurumu(b).bitti).length}/${dersler.length}</b><span>durak tamamlandı</span></div></div>
    <div class="sec-title"><h2>Tekrar etmen gereken konular</h2><span>yanlış sayısına göre</span></div>
    ${zayif.length ? `<div class="weak">${zayif.map(([t, s]) => `<a href="#${ilkBolum(t)}">${ETK[t] || t} <b>${s.y}✗</b></a>`).join("")}</div>` : `<p style="margin:0;color:var(--muted)">Henüz zayıf konu yok. Soruları çözdükçe burada, en çok zorlandığın konular listelenecek.</p>`}
    <div class="sec-title"><h2>Duraklar</h2><span>çözülen / toplam</span></div>
    <div class="bars">${dersler.map(b => { const d = bolumDurumu(b); return `<a class="barrow" href="#${b.id}"><span class="mini" style="background:${HAT_RENK[b.hat]}">${kisa(b.hat)}</span><span><span class="t">${b.baslik}</span><span class="b"><i style="width:${d.c / d.n * 100}%;background:${HAT_RENK[b.hat]}"></i></span></span><span class="n">${d.c}/${d.n}</span></a>`; }).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="sifirla">İlerlemeyi sıfırla</button></div>`;
  const sb = view.querySelector("#sifirla"); let emin = false;
  sb.onclick = () => { if (!emin) { emin = true; sb.textContent = "Emin misin? Tekrar tıkla"; return; } K = { q: {}, t: {}, tema: K.tema }; kaydet(); yanPanel(); haritaSayfasi(); };
}
function denemeSayfasi() {
  view.innerHTML = `<header class="ch-head"><div class="ch-badge" style="background:var(--accent);color:var(--accent-ink)">Py</div><div><div class="eyebrow">Serbest çalışma</div><h1>Deneme tahtası</h1>
    <p>İstediğin kodu yaz ve çalıştır. Örnek veri setleri hazır: <code>yolcu</code>, <code>ham</code>, <code>sefer</code>, <code>iliski</code>, <code>salilar</code>. Grafik çizersen aşağıda görünür.</p></div></header>`;
  const q = { id: "deneme", t: "code", q: "", tags: [], setup: ["yolcu", "ham", "sefer", "iliski", "salilar"], starter: 'print(yolcu.head())\n\n# Hat başına toplam yolcu:\nprint(yolcu.groupby("line_code")["passanger_cnt"].sum())\n', sol: "", test: "", hint: "Bir fikir: <code>yolcu[yolcu[\"age\"] == \"60+\"].groupby(\"line_code\")[\"passanger_cnt\"].sum()</code>" };
  const kart = soruKart(q, 1, 1, { baslik: "Serbest kod" });
  kart.querySelector(".q-top .tur").textContent = "Serbest kod"; kart.querySelector(".q-text").remove();
  const btns = kart.querySelectorAll(".row .btn"); btns[1].hidden = true;
  view.appendChild(kart);
  view.appendChild(el(`<section class="prose"><h3>Veri setleri</h3><ul>
    <li><code>yolcu</code> — temizlenmiş yolcu verisi örneği (${C.veriler.YOLCU_CSV.split("\n").length - 1} satır, 5 hat, 3 gün, 3 yaş grubu)</li>
    <li><code>ham</code> — temizlenmemiş hâli (clean_data.py alıştırmaları için)</li>
    <li><code>sefer</code> — geniş formatta sefer sayıları</li>
    <li><code>iliski</code> — 8 hat için 60+ payı ve hafta sonu oranı</li>
    <li><code>salilar</code> — bir hattın 9 haftalık Salı yolcusu (bin)</li></ul>
    <p>Hepsi uydurma, küçük örneklerdir; sütun yapısı senin projenle aynıdır.</p></section>`));
}

/* ─── yan panel ─── */
function yanPanel() {
  const lm = document.getElementById("lineMap"); const r = location.hash.slice(1) || "harita";
  lm.querySelectorAll(".stop").forEach(x => x.remove());
  BOL.forEach(b => {
    const d = b.tur === "ders" ? bolumDurumu(b) : null;
    const li = el(`<li class="stop ${b.tur}${d?.bitti ? " bitti" : ""}"><a href="#${b.id}" ${r === b.id ? 'aria-current="page"' : ""}>
      <span class="node">${b.tur === "tekrar" ? "<span></span>" : `<span style="background:${HAT_RENK[b.hat]}">${kisa(b.hat)}</span>`}</span>
      <span class="nm">${b.baslik}<small>${b.tur === "tekrar" ? "Aktarma · tekrar" : b.ozet.split(/[.:—]/)[0]}</small></span>
      <span class="chk">${d ? (d.bitti ? "✓" : `${d.c}/${d.n}`) : ""}</span></a></li>`);
    lm.appendChild(li);
  });
  requestAnimationFrame(() => {
    const son = [...lm.querySelectorAll(".stop.bitti")].pop();
    document.getElementById("lineFill").style.height = son ? (son.offsetTop + 16 - 14) + "px" : "0px";
  });
  document.querySelectorAll(".side-links a").forEach(a => a.dataset.r === r ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

/* ─── yönlendirme ─── */
function git() {
  const r = location.hash.slice(1) || "harita"; const b = BOL.find(x => x.id === r);
  if (b) b.tur === "ders" ? dersSayfasi(b) : tekrarSayfasi(b);
  else if (r === "deneme") denemeSayfasi(); else haritaSayfasi();
  yanPanel(); window.scrollTo(0, 0);
  document.getElementById("side").classList.remove("acik"); document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
  if (b && b.sorular && b.sorular.some(q => q.t === "code") && !py) pyHazirla().catch(() => {});
}
addEventListener("hashchange", git);
document.getElementById("menuBtn").onclick = e => { const s = document.getElementById("side"); s.classList.toggle("acik"); e.currentTarget.setAttribute("aria-expanded", s.classList.contains("acik")); };

/* ─── tema ─── */
function tema(t) { K.tema = t; kaydet(); if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; document.querySelectorAll(".theme-row button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t)); }
document.querySelectorAll(".theme-row button").forEach(b => b.onclick = () => tema(b.dataset.t));
tema(K.tema || "system");

/* ─── geliştirici kontrolü: tüm örnek çözümleri tarayıcıda çalıştırır ─── */
window.__tumunuDene = async () => {
  const sonuc = [];
  for (const q of Object.values(SORU).filter(q => q.t === "code")) {
    const s = await calistir(q.sol, q.setup, q.test); sonuc.push([q.id, s.hata || (s.test?.ok ? "OK" : s.test?.mesaj)]);
  }
  return sonuc;
};
git();
</script>
